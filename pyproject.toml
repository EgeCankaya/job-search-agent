[project]
name = "inbox-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "boto3[crt]>=1.43.114",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/budgets"]
