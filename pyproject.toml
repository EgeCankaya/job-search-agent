[project]
name = "inbox-agent"
version = "0.1.0"
description = "A personal job-search inbox agent on AWS Bedrock AgentCore: tracks applications, alerts on invites, drafts follow-ups only on approval"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[dependency-groups]
agent = [
    "bedrock-agentcore>=1.24.1",
    "langchain-aws>=1.9.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.16",
    "mcp>=1.30.0",
]
app = [
    "streamlit>=1.66.0",
]
approval = [
    "aws-durable-execution-sdk-python>=2.0.1",
    "mcp>=1.30.0",
]
dev = [
    "aws-durable-execution-sdk-python-testing>=1.2.1",
    "boto3[crt]>=1.43.114",
    "cedarpy==4.12.1",
    "pytest>=9.1.1",
]
eval = [
    "openinference-instrumentation-langchain==0.1.79",
    "opentelemetry-sdk==1.45.1",
]
local = [
    "cedarpy==4.12.1",
    "langchain-ollama>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/budgets"]

[tool.uv]
# The eval group's packages are at least two weeks old (OQ-47 (o)); these
# transitive ones had newer releases than that when they were added (2026-10-31).
constraint-dependencies = [
    "openinference-instrumentation<=0.1.71",
    "openinference-semantic-conventions<=0.1.41",
    "wrapt<=2.5.1",
]
