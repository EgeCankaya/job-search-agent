[project]
name = "inbox-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.273.0",
    "constructs>=10.8.1",
]

[dependency-groups]
agent = [
    "bedrock-agentcore>=1.24.1",
    "langchain-aws>=1.9.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.16",
    "mcp>=1.30.0",
]
app = [
    "streamlit>=1.66.0",
]
approval = [
    "aws-durable-execution-sdk-python>=2.0.1",
    "mcp>=1.30.0",
]
dev = [
    "aws-durable-execution-sdk-python-testing>=1.2.1",
    "boto3[crt]>=1.43.114",
    "cedarpy==4.12.1",
    "pytest>=9.1.1",
]
local = [
    "cedarpy==4.12.1",
    "langchain-ollama>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "src/budgets"]
